name: Generate X and Threads promotion drafts

on:
  workflow_dispatch:
  repository_dispatch:
    types: [social-promotion]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PROMO_SOURCE_URL: ${{ github.event.client_payload.source_url || github.event.client_payload.url || '' }}
      PROMO_WORDPRESS_URL: https://kazuhiro-beetle.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Find latest WordPress article and generate drafts
        run: npm run generate
      - name: Upload drafts
        uses: actions/upload-artifact@v4
        with:
          name: social-promotion-drafts-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Commit drafts
        run: |
          git add out/social-drafts.json out/social-drafts.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: generate social promotion drafts [skip ci]"
          git push
