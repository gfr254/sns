name: Generate X and Threads promotion drafts

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "記事URL（タイトル・要約・正規URL・ハッシュタグを自動抽出）"
        required: true
        type: string
  repository_dispatch:
    types: [social-promotion]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PROMO_SOURCE_URL: ${{ inputs.source_url || github.event.client_payload.source_url || github.event.client_payload.url || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate drafts from article
        run: npm run generate
      - name: Upload drafts
        uses: actions/upload-artifact@v4
        with:
          name: social-promotion-drafts-${{${ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Commit drafts
        run: |
          git add out/social-drafts.json out/social-drafts.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: generate social promotion drafts [skip ci]"
          git push
