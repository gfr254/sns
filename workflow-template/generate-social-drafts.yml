name: Generate X and Threads promotion drafts

on:
  workflow_dispatch:
    inputs:
      title:
        description: "宣伝する記事タイトル"
        required: true
        type: string
      summary:
        description: "記事の要約"
        required: true
        type: string
      url:
        description: "記事URL"
        required: false
        type: string
      hashtags:
        description: "ハッシュタグ（空白区切り）"
        required: false
        default: "空冷VW ビートル 旧車"
        type: string
  repository_dispatch:
    types: [social-promotion]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PROMO_TITLE: ${{ inputs.title || github.event.client_payload.title || '' }}
      PROMO_SUMMARY: ${{ inputs.summary || github.event.client_payload.summary || '' }}
      PROMO_URL: ${{ inputs.url || github.event.client_payload.url || '' }}
      PROMO_HASHTAGS: ${{ inputs.hashtags || github.event.client_payload.hashtags || '空冷VW ビートル 旧車' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate drafts
        run: npm run generate
      - name: Upload drafts
        uses: actions/upload-artifact@v4
        with:
          name: social-promotion-drafts-${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Commit drafts
        run: |
          git add out/social-drafts.json out/social-drafts.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "chore: generate social promotion drafts [skip ci]"
          git push
